<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06112b">
<title>انجمن علمی دانشکده علوم پزشکی خوی</title>
<style>
  :root{
    --deep:#040c22; --navy:#0a1f4a; --blue:#1457c8; --cyan:#5cc8ff;
    --text:#f2f6ff; --muted:#a9bde3; --glass:rgba(255,255,255,.07); --line:rgba(160,200,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{min-height:100%;background:var(--deep)}
  body{
    min-height:100vh;font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
    color:var(--text);display:flex;justify-content:center;align-items:center;
    padding:max(32px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;
    background:
      radial-gradient(70% 45% at 85% 8%,rgba(20,87,200,.55),transparent 70%),
      radial-gradient(60% 40% at 10% 92%,rgba(92,200,255,.22),transparent 70%),
      linear-gradient(170deg,var(--navy) 0%,var(--deep) 75%);
    background-attachment:fixed;
  }
  /* background of virus / cell particles */
  .bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .drift{animation:drift 26s ease-in-out infinite alternate}
  .drift.b{animation-duration:34s;animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translateY(-14px)}to{transform:translateY(14px)}}

  main{position:relative;z-index:1;width:100%;max-width:440px}
  .card{
    background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
    border:1px solid var(--line);border-radius:28px;padding:34px 24px 26px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
    text-align:center;
  }
  .emblem{
    width:96px;height:96px;margin:-82px auto 18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#2f86ff,#0d2f78 70%);
    border:2px solid var(--cyan);display:grid;place-items:center;
    box-shadow:0 0 0 8px rgba(92,200,255,.12),0 12px 30px rgba(20,87,200,.6);
  }
  .emblem svg{width:54px;height:54px}
  .kicker{color:var(--cyan);font-size:.92rem;font-weight:600}
  h1{font-size:1.55rem;line-height:1.75;font-weight:800;margin-top:4px}
  .sub{color:var(--muted);font-size:.95rem;line-height:1.9;margin-top:10px}
  .rule{height:1px;margin:24px 0 22px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

  .links{display:grid;gap:14px}
  a.btn{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;
    background:var(--glass);border:1px solid var(--line);color:var(--text);text-decoration:none;
    text-align:right;transition:transform .15s,background .15s,border-color .15s;
  }
  a.btn:hover,a.btn:focus-visible{background:rgba(92,200,255,.14);border-color:var(--cyan);outline:none;transform:translateY(-2px)}
  a.btn:active{transform:scale(.98)}
  .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
  .ic svg{width:28px;height:28px;fill:#fff}
  .tg .ic{background:linear-gradient(145deg,#37aee2,#1e96c8)}
  .ig .ic{background:linear-gradient(45deg,#f9a03a,#e1306c 50%,#7a3fd1)}
  .t{flex:1;min-width:0}
  .t strong{display:block;font-size:1.05rem}
  .t span{display:block;color:var(--muted);font-size:.86rem;direction:ltr;text-align:right;margin-top:3px}
  .go{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  footer{margin-top:24px;color:var(--muted);font-size:.8rem;line-height:1.9}
  @media (prefers-reduced-motion:reduce){.drift{animation:none}a.btn{transition:none}}
</style>
</head>
<body>

<svg class="bg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#7fd4ff"/><stop offset=".55" stop-color="#2a7be0"/><stop offset="1" stop-color="#0f3a8f"/>
    </radialGradient>
    <filter id="soft1"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="6"/></filter>
    <symbol id="virus" viewBox="-60 -60 120 120">
      <g stroke="#6fc4ff" stroke-width="2.5" stroke-linecap="round">
        <path d="M0-26V-46M0 26V46M-26 0H-46M26 0H46M-18.4-18.4L-32.5-32.5M18.4 18.4L32.5 32.5M18.4-18.4L32.5-32.5M-18.4 18.4L-32.5 32.5"/>
        <path d="M0-26V-46M0 26V46M-26 0H-46M26 0H46M-18.4-18.4L-32.5-32.5M18.4 18.4L32.5 32.5M18.4-18.4L32.5-32.5M-18.4 18.4L-32.5 32.5" transform="rotate(22.5)"/>
      </g>
      <g fill="#9fdcff">
        <circle cx="0" cy="-48" r="4"/><circle cx="0" cy="48" r="4"/><circle cx="-48" cy="0" r="4"/><circle cx="48" cy="0" r="4"/>
        <circle cx="-34" cy="-34" r="4"/><circle cx="34" cy="34" r="4"/><circle cx="34" cy="-34" r="4"/><circle cx="-34" cy="34" r="4"/>
      </g>
      <circle r="27" fill="url(#core)"/>
      <circle cx="-9" cy="-9" r="6" fill="#fff" opacity=".35"/>
    </symbol>
    <symbol id="cell" viewBox="-50 -50 100 100">
      <circle r="38" fill="none" stroke="#6fc4ff" stroke-width="2"/>
      <circle r="16" fill="#2a7be0" opacity=".5"/>
      <circle cx="-14" cy="-12" r="3" fill="#9fdcff"/><circle cx="16" cy="14" r="2.5" fill="#9fdcff"/>
    </symbol>
  </defs>

  <g class="drift">
    <use href="#virus" x="40"  y="120"  width="260" height="260" opacity=".55" filter="url(#soft2)" transform="rotate(14 170 250)"/>
    <use href="#virus" x="560" y="470"  width="150" height="150" opacity=".75" filter="url(#soft1)"/>
    <use href="#virus" x="-30" y="860"  width="300" height="300" opacity=".5"  filter="url(#soft2)" transform="rotate(-20 120 1010)"/>
    <use href="#virus" x="610" y="1090" width="110" height="110" opacity=".9"/>
    <use href="#cell"  x="470" y="40"   width="90"  height="90"  opacity=".5"/>
    <use href="#cell"  x="300" y="1220" width="120" height="120" opacity=".4" filter="url(#soft1)"/>
  </g>
  <g class="drift b">
    <use href="#virus" x="330" y="700"  width="70"  height="70"  opacity=".8"/>
    <use href="#virus" x="90"  y="560"  width="60"  height="60"  opacity=".7"/>
    <use href="#virus" x="520" y="880"  width="200" height="200" opacity=".4" filter="url(#soft2)" transform="rotate(35 620 980)"/>
    <use href="#cell"  x="20"  y="400"  width="70"  height="70"  opacity=".45"/>
    <use href="#cell"  x="640" y="250"  width="110" height="110" opacity=".35" filter="url(#soft1)"/>
    <use href="#virus" x="250" y="40"   width="48"  height="48"  opacity=".8"/>
  </g>
</svg>

<main>
  <section class="card">
    <div class="emblem" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 6h10M21 6v14L11 38a3 3 0 0 0 2.6 4.5h20.8A3 3 0 0 0 37 38L27 20V6"/>
        <path d="M15.5 30h17" stroke="#5cc8ff"/>
        <circle cx="21" cy="35.5" r="1.6" fill="#5cc8ff" stroke="none"/><circle cx="28" cy="34" r="1.2" fill="#5cc8ff" stroke="none"/>
      </svg>
    </div>

    <p class="kicker">عضویت در انجمن علمی</p>
    <h1>انجمن علمی دانشکده<br>علوم پزشکی خوی</h1>
    <p class="sub">ما را در تلگرام و اینستاگرام دنبال کنید تا از رویدادها، کارگاه‌ها و مطالب آموزشی باخبر شوید.</p>

    <div class="rule"></div>

    <nav class="links">
      <a class="btn tg" href="https://t.me/anjoman96xoy">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5 2.8 10.7c-.9.4-.9 1.1-.2 1.3l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.8c.3-1.2-.5-1.8-1.6-1.3ZM8.5 13l9.6-6c.5-.3.9-.1.5.2l-7.8 7-.3 3.3-2-4.5Z"/></svg></span>
        <span class="t"><strong>کانال تلگرام</strong><span>@anjoman96xoy</span></span>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <a class="btn ig" href="https://instagram.com/ssa_xums">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.2-3.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg></span>
        <span class="t"><strong>پیج اینستاگرام</strong><span>@ssa_xums</span></span>
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
    </nav>

    <footer>انجمن علمی دانشجویی<br>دانشکده علوم پزشکی خوی</footer>
  </section>
</main>
</body>
</html>
